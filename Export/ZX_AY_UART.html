<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZX Spectrum · LED UART</title>
<style>
:root{color-scheme:dark;font:15px "Segoe UI",sans-serif;background:#171816;color:#ece8dc}
body{max-width:960px;margin:auto;padding:clamp(14px,3vw,38px)}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1,h2,p{margin:0}h1{font-size:clamp(24px,4vw,36px);letter-spacing:-.04em}h2{font-size:17px;margin-bottom:10px}
nav{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button{font:inherit;color:inherit;background:#2d302b;border:1px solid #525a4b;border-radius:7px;padding:7px 10px;cursor:pointer}
button.primary{background:#bbe77d;color:#232b13;border-color:#bbe77d;font-weight:650}
button:focus-visible,canvas:focus-visible{outline:2px solid #bbe77d;outline-offset:3px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
section{background:#222420;border:1px solid #3f4438;border-radius:12px;padding:14px;min-width:0}
canvas{display:block;width:min(100%,544px);height:auto;margin-inline:auto;image-rendering:pixelated;background:#111;border-radius:8px}
#board-frame{width:100%;display:block;border:0;height:450px;color-scheme:dark}
#error{color:#ff9f92;margin:10px 0 0}#error:empty{display:none}

</style>
</head>
<body>
<header><h1>ZX Spectrum · LED UART</h1><nav>
<button id="bricks" class="primary">ZX Brick Demo</button>
<button id="run">Demo Basic</button>
<button id="reset">Сброс</button>
</nav></header>
<main>
<section><canvas id="screen" width="320" height="240" tabindex="0" aria-label="Экран ZX Spectrum"></canvas></section>
<section><iframe id="board-frame" title="Плата, матрицы и клавиши ZX Spectrum"></iframe></section>
</main>

<script>

"use strict";

const AVR_MODELS = {
  "168": {name: "ATmega168", flash: 16 * 1024, sram: 1024, eeprom: 512},
  "328p": {name: "ATmega328P", flash: 32 * 1024, sram: 2048, eeprom: 1024}
};
const AVR_CLOCK_HZ = 16_000_000;

function parseHex(source, model) {
  const bytes = new Uint8Array(model.flash).fill(0xff);
  const written = new Uint8Array(model.flash);
  let base = 0;
  let eof = false;
  let used = 0;
  for (const [index, raw] of source.split(/\r?\n/).entries()) {
    const line = raw.trim();
    if (!line) continue;
    const fail = reason => { throw new Error(`Строка ${index + 1}. ${reason}`); };
    if (eof) fail("Данные после конца файла.");
    if (line.length > 521 || !/^:(?:[0-9a-f]{2}){5,}$/i.test(line)) {
      fail("Ожидалась запись Intel HEX.");
    }
    const record = line.slice(1).match(/../g).map(pair => parseInt(pair, 16));
    const [count, high, low, kind] = record;
    const address = (high << 8) | low;
    if (record.length !== count + 5) fail("Неверная длина записи.");
    if (record.reduce((sum, value) => sum + value, 0) & 0xff) fail("Ошибка контрольной суммы.");
    const data = record.slice(4, -1);

    switch (kind) {
      case 0: {
        const start = base + address;
        if (start + count > bytes.length) {
          fail(`Адрес за пределами ${model.flash / 1024} КБ Flash ${model.name}.`);
        }
        for (let i = 0; i < count; i++) {
          const at = start + i;
          if (written[at] && bytes[at] !== data[i]) fail("Перекрывающиеся записи Flash.");
          if (!written[at]) used++;
          written[at] = 1;
          bytes[at] = data[i];
        }
        break;
      }
      case 1:
        if (count || address) fail("Неверная запись конца файла.");
        eof = true;
        break;
      case 2:
      case 4:
        if (count !== 2 || address) fail("Неверный расширенный адрес.");
        base = ((data[0] << 8) | data[1]) * (kind === 4 ? 65536 : 16);
        break;
      case 3:
      case 5:
        if (count !== 4 || address) fail("Неверная запись точки входа.");
        break;
      default:
        fail(`Тип записи ${kind} не поддерживается.`);
    }
  }
  if (!eof) throw new Error("Отсутствует завершающая запись Intel HEX.");
  if (!written[0] || !written[1] || (bytes[0] === 0xff && bytes[1] === 0xff)) {
    throw new Error("В Flash нет кода по адресу сброса 0x0000.");
  }
  return {program: new Uint16Array(bytes.buffer), used};
}

function detectAvrGccTarget(program) {
  const reset = program[0];
  let entry = 0;
  if (reset === 0x940c) entry = program[1]; // JMP to the startup routine.
  else if ((reset & 0xf000) === 0xc000) entry = 1 + ((reset << 20) >> 20);

  const immediate = word => ((word >> 4) & 0xf0) | (word & 0x0f);
  for (let i = entry; i >= 0 && i < entry + 16 && i + 3 < program.length; i++) {
    const [low, high, sph, spl] = program.subarray(i, i + 4);
    // avr-gcc: ldi r28, lo8(RAMEND); ldi r29, hi8(RAMEND);
    //          out SPH, r29; out SPL, r28.
    if ((low & 0xf0f0) !== 0xe0c0 || (high & 0xf0f0) !== 0xe0d0 ||
        sph !== 0xbfde || spl !== 0xbfcd) continue;
    const ramEnd = (immediate(high) << 8) | immediate(low);
    return Object.keys(AVR_MODELS).find(id => ramEnd === 0xff + AVR_MODELS[id].sram);
  }
}

const codeB = [0x7e, 0x30, 0x6d, 0x79, 0x33, 0x5b, 0x5f, 0x70,
               0x7f, 0x7b, 0x01, 0x4f, 0x37, 0x0e, 0x67, 0x00];

class Max7219Chain {
  constructor() {
    // Serial route from MOSI. Display data are read in physical U1–U5 order.
    this.route = [3, 2, 1, 0, 4];
    this.words = new Uint16Array(5);
    this.registers = Array.from({length: 5}, () => new Uint8Array(16));
    this.latches = 0;
  }

  shiftBit(incoming) {
    for (const index of this.route) {
      const outgoing = this.words[index] >>> 15;
      this.words[index] = (this.words[index] << 1) | incoming;
      incoming = outgoing;
    }
  }

  shiftByte(value, lsbFirst) {
    for (let bit = 0; bit < 8; bit++) {
      this.shiftBit((value >> (lsbFirst ? bit : 7 - bit)) & 1);
    }
  }

  latch() {
    for (const [i, word] of this.words.entries()) {
      const register = (word >>> 8) & 15;
      if (register) this.registers[i][register] = word & 0xff;
    }
    this.latches++;
  }

  digit(chip, row) {
    const registers = this.registers[chip];
    if (registers[15] & 1) return 0xff;
    if (!(registers[12] & 1) || row > (registers[11] & 7)) return 0;
    const value = registers[row + 1];
    return registers[9] & (1 << row) ? (value & 0x80) | codeB[value & 15] : value;
  }

  intensity(chip) {
    return this.registers[chip][15] & 1 ? 15 : this.registers[chip][10] & 15;
  }
}

const avrButtonPins = {brightness: 2, "mode-keys": 3, "mode-screen": 4};

class VirtualDS1307 {
  constructor() {
    this.epoch = Date.now();
    this.cycles = 0;
    this.halted = false;
    this.pointer = 0;
    this.ram = new Uint8Array(64);
  }

  now(cycles) {
    const elapsed = this.halted ? 0 : (cycles - this.cycles) * 1000 / AVR_CLOCK_HZ;
    return new Date(this.epoch + elapsed);
  }

  attach(twi, cpu) {
    const bcd = value => ((Math.floor(value / 10) << 4) | (value % 10));
    const decimal = value => (value >> 4) * 10 + (value & 15);
    const tick = () => this.now(cpu.cycles);
    let connected = false;
    let addressByte = false;
    let snapshot;
    twi.eventHandler = {
      start: () => twi.completeStart(),
      stop: () => { connected = false; twi.completeStop(); },
      connectToSlave: (address, write) => {
        connected = address === 0x68;
        addressByte = write;
        const time = tick();
        snapshot = [bcd(time.getSeconds()) | (this.halted ? 0x80 : 0),
          bcd(time.getMinutes()), bcd(time.getHours()), time.getDay() + 1,
          bcd(time.getDate()), bcd(time.getMonth() + 1), bcd(time.getFullYear() % 100)];
        twi.completeConnect(connected);
      },
      writeByte: value => {
        if (connected && addressByte) {
          this.pointer = value & 63;
          addressByte = false;
        } else if (connected) {
          const address = this.pointer;
          const time = tick();
          switch (address) {
            case 0: time.setSeconds(decimal(value & 0x7f), 0); this.halted = Boolean(value & 0x80); break;
            case 1: time.setMinutes(decimal(value & 0x7f)); break;
            case 2: time.setHours(value & 0x40
              ? decimal(value & 0x1f) % 12 + (value & 0x20 ? 12 : 0)
              : decimal(value & 0x3f)); break;
            case 4: time.setDate(decimal(value & 0x3f)); break;
            case 5: time.setMonth(decimal(value & 0x1f) - 1); break;
            case 6: time.setFullYear(2000 + decimal(value)); break;
            default: this.ram[address] = value;
          }
          if (address < 7) {
            this.epoch = time.getTime();
            this.cycles = cpu.cycles;
          }
          this.pointer = (address + 1) & 63;
        }
        twi.completeWrite(connected);
      },
      readByte: () => {
        const value = snapshot[this.pointer] ?? this.ram[this.pointer];
        this.pointer = (this.pointer + 1) & 63;
        twi.completeRead(value);
      }
    };
  }
}

  constructor(program, model) {
    this.program = program;
    this.screen = new Uint8Array(32);
    this.lights = new Uint8Array(8);
    this.panelLevels = new Uint8Array(4);
    this.model = model;
    this.audioSample = () => 0;
    this.rtc = new VirtualDS1307();
    this.eeprom = new AVR8.EEPROMMemoryBackend(model.eeprom);

  }

  reset() {
    const rtcTime = this.rtc.now(this.cpu?.cycles ?? 0);
    this.rtc.epoch = rtcTime.getTime();
    this.rtc.cycles = 0;
    const chip = this.cpu = new AVR8.CPU(this.program, this.model.sram);
    this.audioStartCycle = 0;
    const clock = new AVR8.AVRClock(chip, AVR_CLOCK_HZ);
    const gpioB = new AVR8.AVRIOPort(chip, AVR8.portBConfig);
    new AVR8.AVRIOPort(chip, AVR8.portCConfig);
    this.gpioD = new AVR8.AVRIOPort(chip, AVR8.portDConfig);
    this.releases = new Map();
    this.holds = new Map();
    for (const pin of Object.values(avrButtonPins)) this.gpioD.setPin(pin, true);
    new AVR8.AVRTimer(chip, AVR8.timer0Config);
    new AVR8.AVRTimer(chip, AVR8.timer1Config);
    new AVR8.AVRTimer(chip, AVR8.timer2Config);
    this.uart = new AVR8.AVRUSART(chip, AVR8.usart0Config, AVR_CLOCK_HZ);
    const adc = new AVR8.AVRADC(chip, AVR8.adcConfig);
    const readAdc = adc.onADCRead;
    adc.onADCRead = input => {
      const time = (chip.cycles - this.audioStartCycle) / AVR_CLOCK_HZ;
      // The MCP602 outputs idle at half supply. Map normalized audio to ADC volts.
      for (let channel = 0; channel < 2; channel++) {
        const sample = this.audioSample(1 - channel, time);
        adc.channelValues[channel] = 2.5 + 2.5 * Math.max(-1, Math.min(1, sample));
      }
      readAdc(input);
    };
    new AVR8.AVREEPROM(chip, this.eeprom);
    this.rtc.attach(new AVR8.AVRTWI(chip, AVR8.twiConfig, AVR_CLOCK_HZ), chip);
    new AVR8.AVRWatchdog(chip, AVR8.watchdogConfig, clock);

    const displays = this.displays = new Max7219Chain();
    const spi = new AVR8.AVRSPI(chip, AVR8.spiConfig, AVR_CLOCK_HZ);
    const pin = {load: 0x04, mosi: 0x08, clock: 0x20};
    const direction = AVR8.portBConfig.DDR;
    const spiEnabled = () => (chip.data[AVR8.spiConfig.SPCR] & 0x50) === 0x50;
    gpioB.addListener((value, old) => {
      const outputs = chip.data[direction];
      const rising = value & ~old & outputs;
      if (!spiEnabled() && (rising & pin.clock)) {
        displays.shiftBit(value & pin.mosi ? 1 : 0);

      if (rising & pin.load) displays.latch();

  press(button) {
    this.buttonDown(button);
    this.buttonUp(button);
  }

  buttonDown(button) {
    const pin = avrButtonPins[button];
    if (pin === undefined) return;
    const previous = this.releases.get(pin);
    if (previous) this.cpu.clearClockEvent(previous);
    this.releases.delete(pin);
    this.gpioD.setPin(pin, false);
    this.holds.set(pin, this.cpu.cycles);

    const pin = avrButtonPins[button];
    const start = this.holds.get(pin);
    if (start === undefined) return;
    this.holds.delete(pin);
    const release = () => {
      this.gpioD.setPin(pin, true);
      this.releases.delete(pin);
    };
    const remaining = AVR_CLOCK_HZ * 0.055 - (this.cpu.cycles - start);
    if (remaining <= 0) release();
    else this.releases.set(pin, this.cpu.addClockEvent(release, remaining));
  }

  connectAudio(sample) {
    this.audioSample = sample;
    this.audioStartCycle = this.cpu.cycles;
  }

  updateDisplays() {
    this.screen.fill(0);
    for (let chip = 0; chip < 4; chip++) {
      this.panelLevels[chip] = this.displays.intensity(chip);
      for (let y = 0; y < 8; y++) {
        const bits = this.displays.digit(chip, y);
        for (let x = 0; x < 8; x++) {
          if (bits & (0x80 >> x)) this.screen[chip * 8 + x] |= 1 << y;
        }
      }
    }
    for (let y = 0; y < 8; y++) this.lights[y] = this.displays.digit(4, y);
    this.keysLevel = this.displays.intensity(4);
  }

  advanceTo(cycle) {
    while (this.cpu.cycles < cycle) {
      const word = this.program[this.cpu.pc];
      if (word === undefined || word === 0xffff) {
        if (!Number.isInteger(this.cpu.pc)) {
          throw new Error("Некорректный адрес выполнения. Проверьте, для какого МК собран HEX.");
        }
        const address = (this.cpu.pc * 2).toString(16).padStart(4, "0");
        throw new Error(`Выполнение дошло до пустой Flash (0x${address}).`);
      }
      AVR8.avrInstruction(this.cpu);
      this.cpu.tick();
    }
  }

}

<script>
const ZX_HZ = 3_546_900;
const ZX_FRAME = 70_908;
const models = {
  '48': {clock:3_500_000,frame:69_888,line:224,video:14_335},
  '128': {clock:ZX_HZ,frame:ZX_FRAME,line:228,video:14_361}
};
const keyboardRows = [
  ['CapsShift','Z','X','C','V'], ['A','S','D','F','G'], ['Q','W','E','R','T'],
  ['1','2','3','4','5'], ['0','9','8','7','6'], ['P','O','I','U','Y'],
  ['Enter','L','K','J','H'], ['Space','SymbolShift','M','N','B']
];

function fromBase64(source) {
  return Uint8Array.from(atob(source), char => char.charCodeAt(0));
}

class AySerial {
  constructor(board, trace = () => {}) {
    this.board = board;
    this.trace = trace;
    this.reset();
  }

  reset(clock=ZX_HZ) {
    this.ratio=16_000_000/clock;
    this.bit=clock/9600;
    this.fromSpectrum = 1;
    this.fromAvr = [];
    this.incoming = null;
    this.board.uart.onByteTransmit = byte => {
      this.fromAvr.push({time: this.board.cpu.cycles / this.ratio, byte});
      this.trace('ATmega', byte);
    };
  }

  advance(time) {
    while (this.incoming && time >= this.incoming.sample) {
      const frame = this.incoming;
      if (frame.bit === 8) {
        const uart = this.board.uart;
        this.board.advanceTo(Math.floor(frame.sample * this.ratio));
        if (this.fromSpectrum && uart.rxEnable && !uart.rxBusy) {
          uart.writeByte(frame.byte, true);
          this.trace('Spectrum', frame.byte);
        }
        this.incoming = null;
      } else {
        frame.byte |= this.fromSpectrum << frame.bit++;
        frame.sample += this.bit;
      }
    }
    this.board.advanceTo(Math.floor(time * this.ratio));
    while (this.fromAvr.length && time >= this.fromAvr[0].time + 10.02 * this.bit) {
      this.fromAvr.shift();
    }
  }

  write(time, bit) {
    this.advance(time);
    if (this.fromSpectrum && !bit && !this.incoming) {
      this.incoming = {sample: time + 1.5 * this.bit, byte: 0, bit: 0};
    }
    this.fromSpectrum = bit;
  }

  read(time) {
    this.advance(time);
    const frame = this.fromAvr[0];
    if (!frame || time < frame.time) return 1;
    const bit = Math.floor((time - frame.time) / this.bit);
    if (!bit) return 0;
    if (bit > 8) return 1;
    return (frame.byte >> (bit - 1)) & 1;
  }
}

class Spectrum128 {
  constructor(roms, link) {
    this.roms = roms;
    this.link = link;
    this.ram = Array.from({length: 8}, () => new Uint8Array(0x4000));
    this.keys = new Set();
    this.ay = new Uint8Array(16);
    this.sound = new SpectrumSound();
    this.joystick = 0;
    this.hal = {
      tStateCount: 0,
      readMemory: address => this.read(address),
      writeMemory: (address, value) => this.write(address, value),
      readPort: port => this.readPort(port),
      writePort: (port, value) => this.writePort(port, value),
      contendMemory: address => this.contendMemory(address),
      contendPort: address => this.contendPort(address)

    this.reset();
  }

  reset(mode = "128", straightToBasic = true) {
    this.mode=mode;
    this.model=models[mode];
    this.sound.reset(this.model.clock);
    this.joystick=0;
    for (const page of this.ram) page.fill(0);
    this.keys.clear();
    this.ay.fill(0);
    this.ayIndex = 0;
    this.paging = mode === "48" ? 0x30 : straightToBasic ? 0x10 : 0;
    this.border = 7;
    this.frame = 0;
    this.intPending = false;
    this.tape = [];
    this.deck = null;
    this.fastTape = true;
    this.tapeIndex = 0;
    this.cpu.reset();
    this.hal.tStateCount = 0;
    this.deferInterrupt = false;
  }

  page(address) {
    if (address < 0x4000) return this.mode === "48" && this.roms[2] ? this.roms[2] : this.roms[(this.paging >> 4) & 1];

    if (address < 0xc000) return this.ram[2];
    return this.ram[this.paging & 7];
  }

  read(address) {
    address &= 0xffff;
    return this.page(address)[address & 0x3fff];
  }

  write(address, value) {
    address &= 0xffff;
    if (address >= 0x4000) this.page(address)[address & 0x3fff] = value;
  }

  contention() {
    const offset=this.hal.tStateCount%this.model.frame-this.model.video;
    if(offset<0 || Math.floor(offset/this.model.line)>=192 || offset%this.model.line>=128) return 0;
    return Math.max(0,6-(offset&7));

    return (address&0xc000)===0x4000 ||
      (this.mode==="128" && (address&0xc000)===0xc000 && (this.paging&1));
  }

  contendMemory(address) {
    if(this.contended(address)) this.hal.tStateCount+=this.contention();
  }

  contendPort(address) {
    if (!(address&1) || this.contended(address)) this.hal.tStateCount+=this.contention();
  }

  readPort(port) {
    if (!(port & 1)) {
      const ear = this.fastTape ? 0 : this.deck?.ear(this.hal.tStateCount,this.mode==="48");
      let bits = 0xbf | (ear ? 64 : 0);
      for (let r = 0; r < 8; r++) {
        if (!(port & (0x100 << r))) {
          for (let c = 0; c < 5; c++) if (this.keys.has(keyboardRows[r][c])) bits &= ~(1 << c);

    if ((port & 255) === 31) return this.joystick;
    if (this.mode==="128" && (port & 0xc002) === 0xc000) {
      if (this.ayIndex !== 14) return this.ay[this.ayIndex];
      const rx = this.link.read(this.hal.tStateCount);
      return (this.ay[14] & 15) | ((rx ^ 1) << 7);
    }
    return 0xff;
  }

  writePort(port, value) {
    if (!(port & 1)) {
      this.border = value & 7;
      this.sound.enqueue(this.hal.tStateCount,16,value);
    }
    if ((port & 0x8002) === 0 && !(this.paging & 32)) this.paging = value;
    if (this.mode==="48") return;
    const ayPort = port & 0xc002;
    if (ayPort === 0xc000) this.ayIndex = value & 15;
    if (ayPort === 0x8000) {
      this.ay[this.ayIndex] = value;
      if (this.ayIndex<14) this.sound.enqueue(this.hal.tStateCount,this.ayIndex,value);
      if (this.ayIndex === 14 && (this.ay[7] & 0x40)) this.link.write(this.hal.tStateCount, ((value >> 3) & 1) ^ 1);

  }

  mount(tape, tzx=false, fast=true) {
    this.tape=readTape(tape,tzx);
    this.tapeIndex=0;
    this.deck=new TapeDeck(this.tape);
    this.fastTape=fast;
  }

  loadSnapshot(data) {
    this.reset(data.wide?"128":"48");
    this.paging=data.paging;
    this.border=data.border;
    for (const [bank, bytes] of data.banks) this.ram[bank].set(bytes);
    Object.assign(this.cpu.regs,data.regs);
    if (data.ay) {
      this.ay.set(data.ay);
      this.ayIndex=data.ayIndex;
      this.sound.seed(data.ay);
    }
  }

  tapeTrap() {
    const cpu = this.cpu;
    const block = this.tape[this.tapeIndex++].data;
    const flag = cpu.regs.afPrime >> 8;
    const f = cpu.regs.afPrime & 255;
    const {ix, de: length} = cpu.regs;
    const load = Boolean(f & 1);
    let good = block && block[0] === flag && block.length === length + 2 &&
      block.reduce((checksum, value) => checksum ^ value, 0) === 0;
    if (good) {
      for (let i = 0; i < length; i++) {
        if (load) this.write(ix + i, block[1 + i]);
        else if (this.read(ix + i) !== block[1 + i]) good = false;
      }
      cpu.regs.ix += length;
      cpu.regs.de = 0;
    }
    cpu.regs.f = (cpu.regs.f & 254) | Number(Boolean(good));
    cpu.regs.pc = 0x05e2;
    this.hal.tStateCount += 4;
  }

  runTo(target) {
    const cpu = this.cpu;
    while (this.hal.tStateCount < target) {
      const boundary = (this.frame + 1) * this.model.frame;
      if (this.hal.tStateCount >= boundary) {
        this.frame++;

      }
      if (this.intPending) {
        if (this.hal.tStateCount >= this.frame * this.model.frame + 36) this.intPending = false;

        }

      } else cpu.step();
    }
    this.link.advance(this.hal.tStateCount);
  }

  draw(ctx) {
    const colors = [0,0xcd0000,0x0000cd,0xcd00cd,0x00cd00,0xcdcd00,0x00cdcd,0xcdcdcd,
      0,0xff0000,0x0000ff,0xff00ff,0x00ff00,0xffff00,0x00ffff,0xffffff];
    if (!this.image) {
      this.image = ctx.createImageData(256,192);
      this.pixels = new Uint32Array(this.image.data.buffer);
    }
    const color=colors[this.border];
    ctx.fillStyle='rgb('+(color&255)+','+((color>>8)&255)+','+(color>>16)+')';
    ctx.fillRect(0,0,320,240);
    const screen=this.ram[this.paging&8?7:5];
    const flashing=this.frame&16;
    let target=0;
    for(let y=0;y<192;y++) {
      const bitmap=((y&0xc0)<<5)|((y&7)<<8)|((y&0x38)<<2);
      const attrs=6144+(y>>3)*32;
      for(let x=0;x<32;x++) {
        const attr=screen[attrs+x], bright=(attr>>3)&8;
        const flash=Boolean((attr&128)&&flashing);

        const paper=colors[bright|((attr>>3)&7)]|0xff000000;
        const bits=screen[bitmap+x];
        for(let bit=128;bit;bit>>=1) {
          this.pixels[target++]=Boolean(bits&bit)===flash?paper:ink;
        }
      }
    }
    ctx.putImageData(this.image,32,24);
  }
}

    autoKeys = [
      [2200,['J']], [2320,[]], [2440,['SymbolShift','P']], [2560,[]],
      [2680,['SymbolShift','P']], [2800,[]], [2920,['Enter']], [3040,[]]
    ];
  }
}

function playAudio() {
  const rate=context?.sampleRate || 44100;
  const samples=machine.sound.render(machine.hal.tStateCount, rate);
  if(!context || context.state!=='running' || !samples.length)return;
  if(audioNext<context.currentTime) audioNext=context.currentTime+.035;
  if(audioNext-context.currentTime>.20) return;
  const node=context.createBufferSource();
  node.buffer=context.createBuffer(1,samples.length,rate);
  node.buffer.copyToChannel(samples,0);
  node.connect(audioGain);
  audioSources.add(node);
  node.onended=()=>audioSources.delete(node);
  node.start(audioNext);
  audioNext+=samples.length/rate;
}

function animate(now) {
  if (!stopped) {
    try {
      const elapsed = stamp === undefined ? 0 : Math.min(40, now - stamp);
      stamp = now;
      const clock=machine.model.clock;
      target += elapsed * clock / 1000;
      while (autoKeys.length && target >= autoKeys[0][0] * clock / 1000) {
        const [when, keys] = autoKeys.shift();
        machine.runTo(when * clock / 1000);
        machine.keys.clear();
        for (const key of keys) machine.keys.add(key);
        if(!autoKeys.length && !machine.fastTape) machine.deck.play(machine.hal.tStateCount);
      }
      machine.runTo(target);
      if(lastScreenFrame!==machine.frame){
        machine.draw(screenContext);
        lastScreenFrame=machine.frame;
      }
      playAudio();
      if(boardUI && now-lastBoardDraw>=32){
        board.updateDisplays();
        boardUI.refreshBoard(board);
        lastBoardDraw=now;
      }
    } catch (error) {
      stopped = true;
      $('error').textContent = String(error);
      console.error(error);
    }
  }
  requestAnimationFrame(animate);
}

const pcMap = {
  ShiftLeft:['CapsShift'], ShiftRight:['CapsShift'], ControlLeft:['SymbolShift'], ControlRight:['SymbolShift'],
  Enter:['Enter'], Space:['Space'], Backspace:['CapsShift','0'],
  ArrowLeft:['CapsShift','5'], ArrowDown:['CapsShift','6'],
  ArrowUp:['CapsShift','7'], ArrowRight:['CapsShift','8'],
  Comma:['SymbolShift','N'], Period:['SymbolShift','M'], Minus:['SymbolShift','J'],
  Slash:['SymbolShift','V'], Semicolon:['SymbolShift','O'], Equal:['SymbolShift','L']
};
const directions={ArrowRight:1,ArrowLeft:2,ArrowDown:4,ArrowUp:8,ControlLeft:16,ControlRight:16};

function guestKeys(event) {
  if (event.shiftKey && /^Digit[1-9]$/.test(event.code)) {
    const symbol = {Digit1:'1',Digit2:'2',Digit3:'3',Digit4:'4',Digit5:'5',
      Digit6:'H',Digit7:'6',Digit8:'B',Digit9:'8'}[event.code];
    return ['SymbolShift', symbol];
  }
  if (pcMap[event.code]) return pcMap[event.code];
  if (/^Key[A-Z]$/.test(event.code) || /^Digit[0-9]$/.test(event.code)) return [event.code.slice(-1)];
  return [];
}

function keydown(event) {
  if(event.altKey || event.metaKey || event.target.matches?.('input,button,select') || autoKeys.length)return;
  const joystick = kempston ? directions[event.code] || 0 : 0;
  const keys = joystick ? [] : guestKeys(event);
  if(!joystick && !keys.length)return;
  event.preventDefault();
  if(held.has(event.code))return;
  held.set(event.code,{keys,joystick});
  syncKeys();
}
function keyup(event) {
  if(!held.delete(event.code))return;
  syncKeys();
}
document.addEventListener('keydown',keydown);
document.addEventListener('keyup',keyup);
window.addEventListener('blur', () => {
  for (const id of held.keys()) if (!id.startsWith('pcb:')) held.delete(id);
  if(!autoKeys.length)syncKeys();
});

boardFrame.addEventListener('load',()=>{
  const win=boardFrame.contentWindow;
  if(!win.refreshBoard)return;
  boardUI=win;
  win.onBoardButton=id=>board.press(id);
  win.onBoardKey=(key,down)=>{
    if(autoKeys.length)return;
    const id='pcb:'+key;
    if(down) {
      clearTimeout(panelKeys.get(id));
      held.set(id,{keys:[key],joystick:0});
      syncKeys();
    } else panelKeys.set(id,setTimeout(()=>{
      held.delete(id);
      panelKeys.delete(id);
      if(!autoKeys.length)syncKeys();
    },65));
  };
  const child=win.document;
  child.addEventListener('keydown',keydown);
  child.addEventListener('keyup',keyup);
  const fit=()=>{boardFrame.style.height=child.querySelector('main').scrollHeight+12+'px';};
  new ResizeObserver(fit).observe(child.querySelector('main'));
  fit();
});
boardFrame.srcdoc=assets.board;

async function activateAudio(){
  try {
    if(!context){
      context=new AudioContext();
      audioGain=context.createGain();
      audioGain.gain.value=.55;
      audioGain.connect(context.destination);
    }
    await context.resume();
  } catch(error) {
    console.warn('Spectrum audio:',error);
  }
}

function demo() {
  kempston=false;
  boot(fromBase64(assets.tap));
}
$('run').addEventListener('click',()=>{
  void activateAudio();
  demo();
});
$('bricks').addEventListener('click',()=>{
  void activateAudio();
  kempston=true;
  boot(fromBase64(assets.bricks));
});
$('reset').addEventListener('click',()=>{
  kempston=false;
  boot();
});
screen.addEventListener('dragover',event=>event.preventDefault());
screen.addEventListener('drop',async event=>{
  event.preventDefault();
  const file=event.dataTransfer.files[0];
  if(!file)return;
  void activateAudio();
  try{
    if(file.size>32*1024*1024)throw Error('Максимальный размер игры — 32 МБ');
    const bytes=new Uint8Array(await file.arrayBuffer());
    const extension=file.name.toLowerCase().split('.').at(-1);
    if(extension==='tap' || extension==='tzx'){
      const blocks=readTape(bytes,extension==='tzx');
      if(!blocks.length)throw Error('Лента пуста');
      const fast=blocks.every(block=>block.standard);
      boot(bytes,extension==='tzx',fast);
    } else if(extension==='sna' || extension==='z80'){
      machine.loadSnapshot(readSnapshot(bytes,extension));
      afterReset();
    } else throw Error('Поддерживаются TAP, TZX, SNA и Z80');
    kempston=true;
  } catch(error){$('error').textContent=String(error);}
});
demo();
requestAnimationFrame(animate);


</script>
