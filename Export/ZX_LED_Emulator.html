<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZX Spectrum LED Keyboard · Браузерный стенд</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f5efdf;
    --muted: #aaa291;
    --amber: #ffad58;
    --line: #39342c;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 44% 0%, #2b241a, #151311 65%);
    color: var(--ink);
    font: 16px/1.5 system-ui, sans-serif;
  }
  main { width: min(1100px, 100% - 48px); margin: auto; padding: 44px 0 30px; }
  header { margin-bottom: 25px; }
  .kicker, .readout-label, .signature {
    font: 600 11px/1.4 var(--mono);
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  .kicker { color: var(--amber); display: flex; gap: 9px; align-items: center; }
  .kicker::before { content: ""; width: 17px; height: 2px; background: var(--amber); }
  h1 { margin: 8px 0 4px; font-size: clamp(29px, 5vw, 55px); letter-spacing: -.055em; line-height: 1; }
  header p, footer { color: var(--muted); margin: 10px 0 0; }
  .board {
    position: relative;
    container-type: inline-size;
    overflow: hidden;
    isolation: isolate;
    border: 1px solid #2b3645;
    border-radius: clamp(4px, 1vw, 10px);
    background: radial-gradient(ellipse at 50% 16%, #17212b, #0c111b 76%);
    box-shadow: inset 0 1px #62718b30, 0 6px #070b11, 0 22px 48px #0009;
  }
  .board-item { position: absolute; }
  #screen {
    display: block;
    border-radius: 0.35cqw;
    box-shadow: 0 0.6cqw #666d58, 0 1cqw 1.4cqw #000b;
    background: #070d07;
  }
  .hole {
    transform: translate(-50%, -50%);
    width: 2.6%;
    aspect-ratio: 1;
    border: 1px solid #394353;
    border-radius: 50%;
    background: #080b12;
    box-shadow: inset 0 1px 3px #000, 0 0 0 0.2cqw #27313f88;
  }
  .isp {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.35cqw;
    padding: 0.25cqw;
    border: 1px solid #3d4c60;
    border-radius: 0.2cqw;
    background: #0a0e15;
  }
  .isp i {
    width: 0.58cqw;
    height: 0.58cqw;
    border-radius: 15%;
    background: linear-gradient(145deg, #d0b783, #60533c);
  }
  button {
    min-width: 0;
    border: 1px solid #51483b;
    border-radius: 7px;
    padding: 9px 10px;
    background: #28241e;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #373026; border-color: #8b6c4f; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  .board-control {
    transform: translate(-50%, -50%);
    touch-action: manipulation;
    width: 4%;
    height: 4%;
    border-color: #6d5354;
    border-radius: 0.42cqw;
    padding: 0;
    background: linear-gradient(165deg, #aa7472, #4c333b);
    box-shadow: 0 0.24cqw #080b11, inset 0 1px #f9c6b88c;
  }
  .board-control:hover { background: #a36661; }
  .board-control:active { transform: translate(-50%, -43%); }
  .board-control span {
    position: absolute;
    top: 50%;
    left: calc(100% + 0.6cqw);
    transform: translateY(-50%);
    color: #bfc2cd;
    font: 600 0.74cqw/1 var(--mono);
    white-space: nowrap;
    pointer-events: none;
  }
  .board-controls { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
  .hardware-button { text-align: left; flex: 1 1 108px; }
  .hardware-button b { color: var(--amber); font: 600 11px/1.3 var(--mono); }
  .hardware-button span { display: block; margin-top: 2px; font-size: 12px; }
  .key {
    transform: translate(-50%, -50%);
    width: 6.8%;
    aspect-ratio: 1;
    border: 1px solid #414b5b;
    border-radius: 0.25cqw;
    background: radial-gradient(circle at 50% 56%, #28303e, #151c28 49%, #111722 74%);
    color: #e0e4ef;
    font: 650 1.36cqw/1 var(--mono);
    white-space: pre-line;
    text-align: center;
    padding-top: 0.57cqw;
    user-select: none;
    touch-action: none;
  }
  .key.special { font-size: 0.90cqw; }
  .key.down { background: #3b4354; border-color: #9ca9be; }
  .pcb-led {
    z-index: 2;
    pointer-events: none;
    width: 0.83%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 40%;
    background: #2a3039;
  }
  .pcb-led.on {
    background: color-mix(in srgb, var(--led) 42%, #fff);
    opacity: var(--level, 1);
    box-shadow: 0 0 0.55cqw 0.18cqw var(--led), 0 0 1.65cqw 0.4cqw var(--led);
  }
  .pcb-led.side { width: 0.72%; }
  .bench {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 1px solid var(--line);
    margin-top: 21px;
    padding-bottom: 14px;
  }
  .bench-buttons { display: flex; gap: 8px; align-items: center; }
  .bench-buttons button { font-size: 13px; }
  .bench-buttons button:disabled { opacity: .47; cursor: default; transform: none; }
  .firmware-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; }
  .firmware-controls button { font-size: 13px; }
  .audio-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: -5px 0 15px; }
  .audio-controls button, #audio-status { font-size: 12px; }
  #audio-status { color: var(--muted); overflow-wrap: anywhere; }
  .volume, .view-controls {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    color: var(--muted); font-size: 12px;
  }
  .volume input { width: 86px; accent-color: var(--amber); }
  .volume output { min-width: 4ch; font-variant-numeric: tabular-nums; }
  .view-controls { margin-bottom: 12px; }
  .view-controls button, .view-controls select { font-size: 12px; }
  .view-controls select {
    padding: 7px; border: 1px solid #51483b; border-radius: 7px;
    background: #28241e; color: var(--ink);
  }
  .board-stage.rotatable {
    perspective: 1300px;
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
    padding: min(3vw, 26px) min(4vw, 38px);
  }
  .board-stage.rotatable.dragging { cursor: grabbing; }
  .board-stage.rotatable .board {
    overflow: visible; isolation: auto; transform-style: preserve-3d;
    box-shadow: 0 0.55cqw #0b1421, 0 1.05cqw #060b12, 0 22px 50px #000b;
  }
  .board .key { transition: background-color 100ms ease; }
  .board[data-caps="clear"] { --cap-top: #d1e8fa36; --cap-side: #9dbad44d; --cap-ink: #fff; }
  .board[data-caps="white"] { --cap-top: #e4e0d5a8; --cap-side: #c1baaeb5; --cap-ink: #161d25; }
  .board[data-caps="black"] { --cap-top: #242935b6; --cap-side: #131a248f; --cap-ink: #f3f6fc; }
  .key { --solid-height: var(--cap-height); }
  .key.down { --solid-height: calc(var(--cap-height) * 0.76); }
  .cap-top, .solid-wall {
    position: absolute;
    pointer-events: none;
    box-sizing: border-box;
  }
  .cap-top, .solid-wall { display: none; }
  .board[data-caps]:not([data-caps="none"]) .key:not(.bare-key) .cap-top {
    display: grid; place-items: center;
    inset: 0.25cqw;
    border: 1px solid #d6e7ff65;
    border-radius: 0.85cqw;
    color: var(--cap-ink);
    text-shadow: 0 0 0.3cqw #a7b3cc;
    background: linear-gradient(148deg,#fff4,transparent 44%,#05091759),var(--cap-top);
    box-shadow: inset 0 0.3cqw #fff3, inset 0 -0.2cqw #0006, 0 0.42cqw 0.72cqw #0009;
  }
  .board[data-caps]:not([data-caps="none"]) .key:not(.bare-key) > .key-legend { visibility: hidden; }
  .key.is-lit {
    background: radial-gradient(ellipse at 50% 80%,color-mix(in srgb,var(--led) 69%,transparent),transparent 74%),
      radial-gradient(circle at 50% 56%,#28303e,#151c28 56%,#111722 82%);
    box-shadow: 0 0 1.15cqw color-mix(in srgb,var(--led) 45%,transparent);
  }
  .key.is-lit .cap-top::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(ellipse at 50% 78%,color-mix(in srgb,var(--led) 78%,white),
      color-mix(in srgb,var(--led) 55%,transparent) 36%,transparent 77%);
    opacity: var(--cap-glow, 0.8);
  }
  .cap-legend { position: relative; }
  .matrix-body { --solid-height: var(--matrix-height); pointer-events: none; }
  /* preserve-3d makes the keyboard layer the containing block for the keys.
     Match the PCB bounds so their percentage coordinates work in both views. */
  #keyboard { position: absolute; inset: 0; pointer-events: none; }
  #keyboard > .key { pointer-events: auto; }
  .board-stage.rotatable :is(.key,.matrix-body,#keyboard) { transform-style: preserve-3d; }
  .board-stage.rotatable .cap-top { transform: translateZ(var(--solid-height)); }
  .board-stage.rotatable :is(.matrix-body,.board[data-caps]:not([data-caps="none"]) .key:not(.bare-key)) > .solid-wall {
    display: block;
  }
  .solid-wall { transform-origin: top left; }
  .solid-wall.north, .solid-wall.south {
    left: 0; width: 100%; height: var(--solid-height);
    transform: translateZ(var(--solid-height)) rotateX(-90deg);
  }
  .solid-wall.north { top: 0; }
  .solid-wall.south { top: 100%; }
  .solid-wall.west, .solid-wall.east {
    top: 0; width: var(--solid-height); height: 100%;
    transform: translateZ(var(--solid-height)) rotateY(90deg);
  }
  .solid-wall.west { left: 0; }
  .solid-wall.east { left: 100%; }
  .key > .solid-wall { background: linear-gradient(140deg,#b9d5ff54,transparent),var(--cap-side); }
  .key.is-lit > .solid-wall {
    box-shadow: inset 0 0 1.6cqw color-mix(in srgb,var(--led) 63%,transparent);
  }
  .matrix-body > .solid-wall {
    background: linear-gradient(145deg,#57625a,#26332b 30%,#151e18 76%,#354139);
    border: 1px solid #121c16;
  }
  .matrix-body > .solid-wall.south { background: linear-gradient(#38483c,#151e18 70%,#5a6b5d); }
  .board-stage.rotatable #screen { transform: translateZ(var(--matrix-height)); box-shadow: none; }
  .board.cap-edit .key { cursor: pointer; }
  .firmware-controls label { color: var(--muted); font: 13px/1.4 var(--mono); }
  .firmware-controls select {
    padding: 8px; border: 1px solid #51483b; border-radius: 7px;
    color: var(--ink); background: #28241e; font: inherit;
  }
  #load-hex { color: #24170e; background: #efaa61; border-color: #efaa61; font-weight: 650; }
  #load-hex:hover { background: #ffc487; }
  #firmware-status { color: var(--muted); font: 13px/1.4 var(--mono); overflow-wrap: anywhere; }
  #firmware-status.error { color: #ffa89e; }
  .readout { display: flex; gap: 19px; margin: 0; }
  .readout-label { color: var(--muted); }
  .readout dd { margin: 3px 0 0; font: 600 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
  footer { font-size: 13px; }
  .signature { color: #aaa291; padding: 8px 0 0; }
  @media (max-width: 590px) {
    main { width: calc(100% - 24px); padding-top: 23px; }
    .bench { align-items: flex-start; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker" id="board-mcu">ATmega168 · 16 МГц</div>
    <h1>ZX Spectrum LED Keyboard</h1>
    <p>Браузерный стенд для проверки прошивок и подсветки клавиатуры.</p>
  </header>
  <div class="firmware-controls" aria-label="Прошивка">
    <label for="mcu">МК</label>
    <select id="mcu">
      <option value="168">ATmega168</option>
      <option value="328p">ATmega328P</option>
    </select>
    <input type="file" id="hex-file" accept=".hex,text/plain" hidden>
    <button type="button" id="load-hex">Загрузить .hex</button>
    <button type="button" id="load-test">Тестовый HEX</button>
    <button type="button" id="load-matrix">Matrix HEX</button>
    <button type="button" id="load-all-effects" hidden>Все эффекты HEX</button>
    <button type="button" id="use-demo" hidden>Вернуться к демо</button>
    <span id="firmware-status" role="status">Демо · бегущая строка и 4 эффекта</span>
  </div>
  <div class="audio-controls" aria-label="Вход AUDIO">
    <input type="file" id="audio-file" accept="audio/*,.wav,.mp3,.ogg,.flac" hidden>
    <button type="button" id="audio-test">Тестовый звук</button>
    <button type="button" id="audio-load">Открыть аудио</button>
    <button type="button" id="audio-play" hidden>Воспроизвести</button>
    <button type="button" id="audio-stop">Тишина</button>
    <label class="volume" for="audio-volume">Громкость
      <input type="range" id="audio-volume" min="0" max="100" value="60">
      <output id="audio-volume-value" for="audio-volume">60%</output>
    </label>
    <span id="audio-status" role="status">J3 AUDIO · тишина</span>
    <audio id="music-player" preload="auto" loop hidden></audio>
  </div>
  <div class="view-controls" aria-label="Внешний вид">
    <button type="button" id="view-3d" aria-pressed="false">3D-вид</button>
    <button type="button" id="reset-view" hidden>Сбросить ракурс</button>
    <label for="keycaps">Кейкапы</label>
    <select id="keycaps">
      <option value="none">Сняты</option><option value="clear">Прозрачные</option>
      <option value="white">Белые</option><option value="black">Чёрные</option>
    </select>
    <button type="button" id="edit-keycaps" aria-pressed="false" disabled>Кейкапы по одному</button>
  </div>
  <div id="board-stage" class="board-stage">
  <section id="board" class="board" aria-label="Плата ZX Spectrum с зелёными матрицами и цветной подсветкой">
    <canvas id="screen" class="board-item" width="640" height="160" role="img" aria-label="4 зелёные матрицы с бегущей строкой"></canvas>
    <div id="keyboard" aria-label="40 клавиш Spectrum"></div>
    <div id="leds" aria-label="40 светодиодов под клавишами и 24 боковых светодиода"></div>
  </section>
  </div>
  <div class="board-controls" aria-label="Кнопки платы">
    <button type="button" id="brightness" class="hardware-button"><b>BRIGHTNESS</b><span id="brightness-state"></span></button>
    <button type="button" id="mode-keys" class="hardware-button"><b>MODE KEYS</b><span id="keys-state"></span></button>
    <button type="button" id="mode-screen" class="hardware-button"><b>MODE SCREEN</b><span id="screen-state"></span></button>
  </div>
  <div class="signature">J1 · <span id="key-state">клавиши отпущены</span></div>
  <div class="bench">
    <div class="bench-buttons" aria-label="Управление стендом">
      <button type="button" id="pause">Пауза</button>
      <button type="button" id="step" disabled>Шаг</button>
      <button type="button" id="reset">Сброс</button>
    </div>
    <dl class="readout">
      <div><dt class="readout-label">Кадр</dt><dd id="frame-number">0</dd></div>
      <div><dt class="readout-label" id="timing-label">Период</dt><dd id="timing">75 мс</dd></div>
    </dl>
  </div>
  <footer>Клавиши подключены к J1. Режимы подсветки переключаются кнопками справа от матриц.</footer>
</main>
<script id="firmware-model">
"use strict";

// Message and 5×7 font from firmware/ZX_LED168/zx_led168.c.
const firmware = {"message":"SPECTRUM FOREVER!   АНАТОЛИЧ, БОМБА!!!","staticText":"ZX48K","brightness":[0,2,4,8],"font":{"A":[126,17,17,17,126],"B":[127,73,73,73,54],"C":[62,65,65,65,34],"D":[127,65,65,34,28],"E":[127,73,73,73,65],"F":[127,9,9,9,1],"G":[62,65,73,73,122],"H":[127,8,8,8,127],"I":[0,65,127,65,0],"J":[32,64,65,63,1],"K":[127,8,20,34,65],"L":[127,64,64,64,64],"M":[127,2,12,2,127],"N":[127,4,8,16,127],"O":[62,65,65,65,62],"P":[127,9,9,9,6],"Q":[62,65,81,33,94],"R":[127,9,25,41,70],"S":[70,73,73,73,49],"T":[1,1,127,1,1],"U":[63,64,64,64,63],"V":[31,32,64,32,31],"W":[63,64,56,64,63],"X":[99,20,8,20,99],"Y":[7,8,112,8,7],"Z":[97,81,73,69,67],"0":[62,81,73,69,62],"1":[0,66,127,64,0],"2":[66,97,81,73,70],"3":[33,65,69,75,49],"4":[24,20,18,127,16],"5":[39,69,69,69,57],"6":[60,74,73,73,48],"7":[1,113,9,5,3],"8":[54,73,73,73,54],"9":[6,73,73,41,30],"А":[126,17,17,17,126],"М":[127,2,12,2,127],"Н":[127,8,8,8,127],"О":[62,65,65,65,62],"Т":[1,1,127,1,1],"Б":[127,73,73,73,49],"И":[127,16,8,4,127],"Л":[64,62,1,1,127],"Ч":[15,16,16,16,127],"!":[0,0,95,0,0],",":[0,128,96,0,0]," ":[0,0,0,0,0]}};
const brightnessLevels = firmware.brightness;
const screenWidth = 32;
const frameMs = 75;

function textColumns(text) {
  return Array.from(text).flatMap(letter => [...(firmware.font[letter] ?? [0, 0, 0, 0, 0]), 0]);
}

const banner = textColumns(firmware.message);
const staticText = textColumns(firmware.staticText);

class FirmwarePreview {
  constructor() {
    this.screen = new Uint8Array(screenWidth);
    this.lights = new Uint8Array(8);
    this.reset();
  }

  reset() {
    this.screen.fill(0);
    this.lights.fill(0);
    this.frame = 0;
    this.brightnessIndex = 1;
    this.keyMode = 0;
    this.keyStep = 0;
    this.scrolling = true;
    this.offset = -screenWidth;
    this.random = 0x4d35;
    this.screenLevel = this.keysLevel = brightnessLevels[1];
  }

  press(button) {
    switch (button) {
      case "brightness":
        this.brightnessIndex = (this.brightnessIndex + 1) % brightnessLevels.length;
        break;
      case "mode-keys":
        this.keyMode = (this.keyMode + 1) % 4;
        this.keyStep = 0;
        break;
      case "mode-screen":
        this.scrolling = !this.scrolling;
        this.offset = -screenWidth;
        break;
    }
  }

  setLight(x, y) {
    this.lights[y] |= 0x80 >> x;
  }

  nextSpark() {
    const feedback = this.random & 1;
    this.random >>>= 1;
    if (feedback) this.random ^= 0xb400;
    return (this.random ^ (this.random >>> 8)) & 63;
  }

  tick() {
    const columns = this.scrolling ? banner : staticText;
    const start = this.scrolling ? this.offset++ : -1;
    if (this.offset >= banner.length) this.offset = -screenWidth;
    for (let x = 0; x < screenWidth; x++) {
      this.screen[x] = columns[start + x] ?? 0;
    }

    const step = this.keyStep;
    this.keyStep = (step + 1) & 255;
    this.screenLevel = this.keysLevel = brightnessLevels[this.brightnessIndex];
    this.lights.fill(0);
    switch (this.keyMode) {
      case 0:
        for (let y = 0; y < 8; y++) {
          for (let x = 0; x < 8; x++) {
            if (((x + y + step) & 7) < 2) this.setLight(x, y);
          }
        }
        break;
      case 1:
        for (let tail = 0; tail < 10; tail++) {
          const pixel = (step - tail) & 63;
          const y = pixel >> 3;
          const x = pixel & 7;
          this.setLight(y & 1 ? 7 - x : x, y);
        }
        break;
      case 2:
        for (let i = 0; i < 10; i++) {
          const pixel = this.nextSpark();
          this.setLight(pixel & 7, pixel >> 3);
        }
        break;
      case 3: {
        const phase = step & 31;
        const level = phase < 16 ? phase : 31 - phase;
        this.lights.fill(0xff);
        this.keysLevel = Math.floor((level * this.screenLevel + 7) / 15);
        break;
      }
    }
    this.frame++;
  }
}
</script>

            address: this.config.twiInterrupt,

            case 1:

            case 3:

    completeStop() {

        this.cpu.data[this.config.TWCR] &= ~TWCR_TWSTO;
        this.updateStatus(STATUS_TWI_IDLE);
    }
    completeConnect(ack) {
        this.busy = false;
        if (this.cpu.data[this.config.TWDR] & 0x1) {
            this.updateStatus(ack ? STATUS_SLAR_ACK : STATUS_SLAR_NACK);
        }
        else {
            this.updateStatus(ack ? STATUS_SLAW_ACK : STATUS_SLAW_NACK);
        }
    }
    completeWrite(ack) {
        this.busy = false;
        this.updateStatus(ack ? STATUS_DATA_SENT_ACK : STATUS_DATA_SENT_NACK);
    }
    completeRead(value) {
        this.busy = false;
        const ack = !!(this.cpu.data[this.config.TWCR] & TWCR_TWEA);
        this.cpu.data[this.config.TWDR] = value;
        this.updateStatus(ack ? STATUS_DATA_RECEIVED_ACK : STATUS_DATA_RECEIVED_NACK);
    }
    get status() {
        return this.cpu.data[this.config.TWSR] & TWSR_TWS_MASK;
    }
    updateStatus(value) {
        const { TWSR } = this.config;
        this.cpu.data[TWSR] = (this.cpu.data[TWSR] & ~TWSR_TWS_MASK) | value;

// SPDX-License-Identifier: MIT

// Register bits:
const MCUSR_WDRF = 0x8; //  Watchdog System Reset Flag
const WDTCSR_WDIF = 0x80;
const WDTCSR_WDIE = 0x40;
const WDTCSR_WDP3 = 0x20;
const WDTCSR_WDCE = 0x10; // Watchdog Change Enable
const WDTCSR_WDE = 0x8;
const WDTCSR_WDP2 = 0x4;
const WDTCSR_WDP1 = 0x2;
const WDTCSR_WDP0 = 0x1;
const WDTCSR_WDP210 = WDTCSR_WDP2 | WDTCSR_WDP1 | WDTCSR_WDP0;
const WDTCSR_PROTECT_MASK = WDTCSR_WDE | WDTCSR_WDP3 | WDTCSR_WDP210;
const watchdogConfig = {
    watchdogInterrupt: 0x0c,
    MCUSR: 0x54,
    WDTCSR: 0x60,
};

    constructor(cpu, config, clock) {
        this.cpu = cpu;
        this.config = config;
        this.clock = clock;
        this.clockFrequency = 128000;
        /**
         * Used to keep track on the last write to WDCE. Once written, the WDE/WDP* bits can be changed.
         */
        this.changeEnabledCycles = 0;
        this.watchdogTimeout = 0;
        this.enabledValue = false;
        this.scheduled = false;
        // Interrupts
        this.Watchdog = {
            address: this.config.watchdogInterrupt,
            flagRegister: this.config.WDTCSR,
            flagMask: WDTCSR_WDIF,
            enableRegister: this.config.WDTCSR,
            enableMask: WDTCSR_WDIE,

            if (this.enabled && this.cpu.cycles >= this.watchdogTimeout) {
                // Watchdog timed out!
                const wdtcsr = this.cpu.data[this.config.WDTCSR];
                if (wdtcsr & WDTCSR_WDIE) {
                    this.cpu.setInterruptFlag(this.Watchdog);
                }
                if (wdtcsr & WDTCSR_WDE) {
                    if (wdtcsr & WDTCSR_WDIE) {
                        this.cpu.data[this.config.WDTCSR] &= ~WDTCSR_WDIE;
                    }
                    else {
                        this.cpu.reset();
                        this.scheduled = false;
                        this.cpu.data[this.config.MCUSR] |= MCUSR_WDRF;
                        return;
                    }
                }
                this.resetWatchdog();
            }
            if (this.enabled) {
                this.scheduled = true;
                this.cpu.addClockEvent(this.checkWatchdog, this.watchdogTimeout - this.cpu.cycles);
            }
            else {
                this.scheduled = false;
            }
        };
        const { WDTCSR } = config;
        this.cpu.onWatchdogReset = () => {
            this.resetWatchdog();
        };
        cpu.writeHooks[WDTCSR] = (value, oldValue) => {
            if (value & WDTCSR_WDCE && value & WDTCSR_WDE) {
                this.changeEnabledCycles = this.cpu.cycles + 4;
                value = value & ~WDTCSR_PROTECT_MASK;
            }
            else {
                if (this.cpu.cycles >= this.changeEnabledCycles) {
                    value = (value & ~WDTCSR_PROTECT_MASK) | (oldValue & WDTCSR_PROTECT_MASK);
                }
                this.enabledValue = !!(value & WDTCSR_WDE || value & WDTCSR_WDIE);
                this.cpu.data[WDTCSR] = value;
            }
            if (this.enabled) {
                this.resetWatchdog();
            }
            if (this.enabled && !this.scheduled) {
                this.cpu.addClockEvent(this.checkWatchdog, this.watchdogTimeout - this.cpu.cycles);
            }
            this.cpu.clearInterruptByFlag(this.Watchdog, value);
            return true;
        };
    }
    resetWatchdog() {
        const cycles = Math.floor((this.clock.frequency / this.clockFrequency) * this.prescaler);
        this.watchdogTimeout = this.cpu.cycles + cycles;
    }
    get enabled() {
        return this.enabledValue;
    }
    /**
     * The base clock frequency is 128KHz. Thus, a prescaler of 2048 gives 16ms timeout.
     */
    get prescaler() {
        const wdtcsr = this.cpu.data[this.config.WDTCSR];
        const value = ((wdtcsr & WDTCSR_WDP3) >> 2) | (wdtcsr & WDTCSR_WDP210);
        return 2048 << value;
    }
}

Object.assign(exports, {watchdogConfig, AVRWatchdog});

const CLKPCE = 128;
const clockConfig = {
    CLKPR: 0x61,
};
const prescalers = [
    1, 2, 4, 8, 16, 32, 64, 128, 256,
    // The following values are "reserved" according to the datasheet, so we measured
    // with a scope to figure them out (on ATmega328p)
    2, 4, 8, 16, 32, 64, 128,

    constructor(cpu, baseFreqHz, config = clockConfig) {
        this.cpu = cpu;
        this.baseFreqHz = baseFreqHz;
        this.config = config;
        this.clockEnabledCycles = 0;
        this.prescalerValue = 1;
        this.cyclesDelta = 0;
        this.cpu.writeHooks[this.config.CLKPR] = (clkpr) => {
            if ((!this.clockEnabledCycles || this.clockEnabledCycles < cpu.cycles) && clkpr === CLKPCE) {
                this.clockEnabledCycles = this.cpu.cycles + 4;
            }
            else if (this.clockEnabledCycles && this.clockEnabledCycles >= cpu.cycles) {
                this.clockEnabledCycles = 0;
                const index = clkpr & 0xf;
                const oldPrescaler = this.prescalerValue;
                this.prescalerValue = prescalers[index];
                this.cpu.data[this.config.CLKPR] = index;
                if (oldPrescaler !== this.prescalerValue) {
                    this.cyclesDelta =
                        (cpu.cycles + this.cyclesDelta) * (oldPrescaler / this.prescalerValue) - cpu.cycles;
                }
            }
            return true;
        };
    }
    get frequency() {
        return this.baseFreqHz / this.prescalerValue;
    }
    get prescaler() {
        return this.prescalerValue;
    }
    get timeNanos() {
        return ((this.cpu.cycles + this.cyclesDelta) / this.frequency) * 1e9;
    }
    get timeMicros() {
        return ((this.cpu.cycles + this.cyclesDelta) / this.frequency) * 1e6;
    }
    get timeMillis() {
        return ((this.cpu.cycles + this.cyclesDelta) / this.frequency) * 1e3;
    }

<script id="avr-board">
"use strict";

const AVR_MODELS = {
  "168": {name: "ATmega168", flash: 16 * 1024, sram: 1024, eeprom: 512},
  "328p": {name: "ATmega328P", flash: 32 * 1024, sram: 2048, eeprom: 1024}
};
const AVR_CLOCK_HZ = 16_000_000;
const AVR_SLICE_MS = 16;
const AVR_FRAME_CYCLES = AVR_CLOCK_HZ * frameMs / 1000;

function parseHex(source, model) {
  const bytes = new Uint8Array(model.flash).fill(0xff);
  const written = new Uint8Array(model.flash);
  let base = 0;
  let eof = false;
  let used = 0;
  for (const [index, raw] of source.split(/\r?\n/).entries()) {
    const line = raw.trim();
    if (!line) continue;
    const fail = reason => { throw new Error(`Строка ${index + 1}. ${reason}`); };
    if (eof) fail("Данные после конца файла.");
    if (line.length > 521 || !/^:(?:[0-9a-f]{2}){5,}$/i.test(line)) {
      fail("Ожидалась запись Intel HEX.");
    }
    const record = line.slice(1).match(/../g).map(pair => parseInt(pair, 16));
    const [count, high, low, kind] = record;
    const address = (high << 8) | low;
    if (record.length !== count + 5) fail("Неверная длина записи.");
    if (record.reduce((sum, value) => sum + value, 0) & 0xff) fail("Ошибка контрольной суммы.");
    const data = record.slice(4, -1);

    switch (kind) {
      case 0: {
        const start = base + address;
        if (start + count > bytes.length) {
          fail(`Адрес за пределами ${model.flash / 1024} КБ Flash ${model.name}.`);
        }
        for (let i = 0; i < count; i++) {
          const at = start + i;
          if (written[at] && bytes[at] !== data[i]) fail("Перекрывающиеся записи Flash.");
          if (!written[at]) used++;
          written[at] = 1;
          bytes[at] = data[i];
        }
        break;
      }
      case 1:
        if (count || address) fail("Неверная запись конца файла.");
        eof = true;
        break;
      case 2:
      case 4:
        if (count !== 2 || address) fail("Неверный расширенный адрес.");
        base = ((data[0] << 8) | data[1]) * (kind === 4 ? 65536 : 16);
        break;
      case 3:
      case 5:
        if (count !== 4 || address) fail("Неверная запись точки входа.");
        break;
      default:
        fail(`Тип записи ${kind} не поддерживается.`);
    }
  }
  if (!eof) throw new Error("Отсутствует завершающая запись Intel HEX.");
  if (!written[0] || !written[1] || (bytes[0] === 0xff && bytes[1] === 0xff)) {
    throw new Error("В Flash нет кода по адресу сброса 0x0000.");
  }
  return {program: new Uint16Array(bytes.buffer), used};
}

function detectAvrGccTarget(program) {
  const reset = program[0];
  let entry = 0;
  if (reset === 0x940c) entry = program[1]; // JMP to the startup routine.
  else if ((reset & 0xf000) === 0xc000) entry = 1 + ((reset << 20) >> 20);

  const immediate = word => ((word >> 4) & 0xf0) | (word & 0x0f);
  for (let i = entry; i >= 0 && i < entry + 16 && i + 3 < program.length; i++) {
    const [low, high, sph, spl] = program.subarray(i, i + 4);
    // avr-gcc: ldi r28, lo8(RAMEND); ldi r29, hi8(RAMEND);
    //          out SPH, r29; out SPL, r28.
    if ((low & 0xf0f0) !== 0xe0c0 || (high & 0xf0f0) !== 0xe0d0 ||
        sph !== 0xbfde || spl !== 0xbfcd) continue;
    const ramEnd = (immediate(high) << 8) | immediate(low);
    return Object.keys(AVR_MODELS).find(id => ramEnd === 0xff + AVR_MODELS[id].sram);
  }
}

const codeB = [0x7e, 0x30, 0x6d, 0x79, 0x33, 0x5b, 0x5f, 0x70,
               0x7f, 0x7b, 0x01, 0x4f, 0x37, 0x0e, 0x67, 0x00];

class Max7219Chain {
  constructor() {
    // Serial route from MOSI. Display data are read in physical U1–U5 order.
    this.route = [3, 2, 1, 0, 4];
    this.words = new Uint16Array(5);
    this.registers = Array.from({length: 5}, () => new Uint8Array(16));
    this.latches = 0;
  }

  shiftBit(incoming) {
    for (const index of this.route) {
      const outgoing = this.words[index] >>> 15;
      this.words[index] = (this.words[index] << 1) | incoming;
      incoming = outgoing;
    }
  }

  shiftByte(value, lsbFirst) {
    for (let bit = 0; bit < 8; bit++) {
      this.shiftBit((value >> (lsbFirst ? bit : 7 - bit)) & 1);
    }
  }

  latch() {
    for (const [i, word] of this.words.entries()) {
      const register = (word >>> 8) & 15;
      if (register) this.registers[i][register] = word & 0xff;
    }
    this.latches++;
  }

  digit(chip, row) {
    const registers = this.registers[chip];
    if (registers[15] & 1) return 0xff;
    if (!(registers[12] & 1) || row > (registers[11] & 7)) return 0;
    const value = registers[row + 1];
    return registers[9] & (1 << row) ? (value & 0x80) | codeB[value & 15] : value;
  }

  intensity(chip) {
    return this.registers[chip][15] & 1 ? 15 : this.registers[chip][10] & 15;
  }
}

const avrButtonPins = {brightness: 2, "mode-keys": 3, "mode-screen": 4};

class VirtualDS1307 {
  constructor() {
    this.epoch = Date.now();
    this.cycles = 0;
    this.halted = false;
    this.pointer = 0;
    this.ram = new Uint8Array(64);
  }

  now(cycles) {
    const elapsed = this.halted ? 0 : (cycles - this.cycles) * 1000 / AVR_CLOCK_HZ;
    return new Date(this.epoch + elapsed);
  }

  attach(twi, cpu) {
    const bcd = value => ((Math.floor(value / 10) << 4) | (value % 10));
    const decimal = value => (value >> 4) * 10 + (value & 15);
    const tick = () => this.now(cpu.cycles);
    let connected = false;
    let addressByte = false;
    let snapshot;
    twi.eventHandler = {
      start: () => twi.completeStart(),
      stop: () => { connected = false; twi.completeStop(); },
      connectToSlave: (address, write) => {
        connected = address === 0x68;
        addressByte = write;
        const time = tick();
        snapshot = [bcd(time.getSeconds()) | (this.halted ? 0x80 : 0),
          bcd(time.getMinutes()), bcd(time.getHours()), time.getDay() + 1,
          bcd(time.getDate()), bcd(time.getMonth() + 1), bcd(time.getFullYear() % 100)];
        twi.completeConnect(connected);
      },
      writeByte: value => {
        if (connected && addressByte) {
          this.pointer = value & 63;
          addressByte = false;
        } else if (connected) {
          const address = this.pointer;
          const time = tick();
          switch (address) {
            case 0: time.setSeconds(decimal(value & 0x7f), 0); this.halted = Boolean(value & 0x80); break;
            case 1: time.setMinutes(decimal(value & 0x7f)); break;
            case 2: time.setHours(value & 0x40
              ? decimal(value & 0x1f) % 12 + (value & 0x20 ? 12 : 0)
              : decimal(value & 0x3f)); break;
            case 4: time.setDate(decimal(value & 0x3f)); break;
            case 5: time.setMonth(decimal(value & 0x1f) - 1); break;
            case 6: time.setFullYear(2000 + decimal(value)); break;
            default: this.ram[address] = value;
          }
          if (address < 7) {
            this.epoch = time.getTime();
            this.cycles = cpu.cycles;
          }
          this.pointer = (address + 1) & 63;
        }
        twi.completeWrite(connected);
      },
      readByte: () => {
        const value = snapshot[this.pointer] ?? this.ram[this.pointer];
        this.pointer = (this.pointer + 1) & 63;
        twi.completeRead(value);
      }
    };
  }
}

class AvrKeyboard {
  constructor(program, model) {
    this.program = program;
    this.screen = new Uint8Array(32);
    this.lights = new Uint8Array(8);
    this.panelLevels = new Uint8Array(4);
    this.model = model;
    this.audioSample = () => 0;

  reset() {

    const rtcTime = this.rtc.now(this.cpu?.cycles ?? 0);

    this.scheduledCycle = 0;

    const gpioB = new AVR8.AVRIOPort(chip, AVR8.portBConfig);
    new AVR8.AVRIOPort(chip, AVR8.portCConfig);
    this.gpioD = new AVR8.AVRIOPort(chip, AVR8.portDConfig);

    this.holds = new Map();
    for (const pin of Object.values(avrButtonPins)) this.gpioD.setPin(pin, true);
    new AVR8.AVRTimer(chip, AVR8.timer0Config);
    new AVR8.AVRTimer(chip, AVR8.timer1Config);
    new AVR8.AVRTimer(chip, AVR8.timer2Config);
    new AVR8.AVRUSART(chip, AVR8.usart0Config, AVR_CLOCK_HZ);
    const adc = new AVR8.AVRADC(chip, AVR8.adcConfig);

        adc.channelValues[channel] = 2.5 + 2.5 * Math.max(-1, Math.min(1, sample));

    const displays = this.displays = new Max7219Chain();
    const spi = new AVR8.AVRSPI(chip, AVR8.spiConfig, AVR_CLOCK_HZ);

  press(button) {
    this.buttonDown(button);
    this.buttonUp(button);

  buttonDown(button) {

    const start = this.holds.get(pin);
    if (start === undefined) return;

      this.gpioD.setPin(pin, true);
      this.releases.delete(pin);
    };

    if (remaining <= 0) release();

  connectAudio(sample) {
    this.audioSample = sample;
    this.audioStartCycle = this.cpu.cycles;
  }

  updateDisplays() {
    this.screen.fill(0);
    for (let chip = 0; chip < 4; chip++) {
      this.panelLevels[chip] = this.displays.intensity(chip);
      for (let y = 0; y < 8; y++) {

        for (let x = 0; x < 8; x++) {

    }
    for (let y = 0; y < 8; y++) this.lights[y] = this.displays.digit(4, y);

  }

  advanceTo(cycle) {

function lightLevel(level) {
  return Math.min(1, 0.26 + 0.74 * Math.sqrt((2 * level + 1) / 31));
}

function drawMatrix(ctx, levels, columns) {
  const cell = 20;
  ctx.fillStyle = "#080f09";
  ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

  const glows = levels.map(lightLevel);
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < columns.length; x++) {
      const on = columns[x] & (1 << y);
      const glow = glows[x >> 3];
      const centerX = x * cell + 10;
      const centerY = y * cell + 10;
      ctx.beginPath();
      ctx.arc(centerX, centerY, on ? 6.3 : 5.5, 0, 2 * Math.PI);
      ctx.fillStyle = on ? `rgba(111, 255, 69, ${glow})` : "#16261a";
      ctx.shadowColor = on ? `rgba(65, 255, 30, ${glow})` : "transparent";
      ctx.shadowBlur = on ? 5 : 0;
      ctx.fill();
      ctx.shadowBlur = 0;
      if (on) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, 3.4, 0, 2 * Math.PI);
        ctx.fillStyle = `rgba(208, 255, 177, ${glow})`;
        ctx.fill();
      }
    }
  }
  ctx.fillStyle = "#314834";
  for (let x = 8; x < columns.length; x += 8) {
    ctx.fillRect(x * cell - 1, 0, 2, ctx.canvas.height);
  }
}

function render() {
  const levels = preview.panelLevels ? Array.from(preview.panelLevels) : Array(4).fill(preview.screenLevel);
  drawMatrix(screen, levels, preview.screen);
  const keyGlow = lightLevel(preview.keysLevel);
  get("leds").style.setProperty("--level", keyGlow);
  board.style.setProperty("--cap-glow", keyGlow);
  for (const {element, key, digit, mask} of leds) {
    const on = Boolean(preview.lights[digit] & mask);
    element.classList.toggle("on", on);
    key?.classList.toggle("is-lit", on);
  }
  get("frame-number").textContent = preview.frame;
  get("timing").textContent = preview.cpu ? `${Math.floor(preview.cpu.cycles / 16000)} мс` : "75 мс";
}

function updateControls() {
  get("mcu").value = selectedMcu;
  get("board-mcu").textContent = `${AVR_MODELS[selectedMcu].name} · 16 МГц`;
  get("brightness-state").textContent = preview.cpu ? "PD2" : `Уровень ${preview.brightnessIndex + 1} / 4`;
  get("keys-state").textContent = preview.cpu ? "PD3" : effects[preview.keyMode];
  get("screen-state").textContent = preview.cpu ? "PD4" : (preview.scrolling ? "Бегущая строка" : "ZX48K");
  get("pause").textContent = playing ? "Пауза" : "Продолжить";
  get("step").disabled = playing;
  get("use-demo").hidden = !preview.cpu;
  get("timing-label").textContent = preview.cpu ? "Время AVR" : "Период";
}

function tick(realtime = false) {
  try {
    if (preview.cpu) syncAudio(preview);
    if (realtime && preview.cpu) preview.slice();
    else preview.tick();
  } catch (error) {
    playing = false;
    run();
    setStatus(error.message, true);
  }
  render();
}

function run() {
  clearInterval(timer);
  if (playing) {
    timer = setInterval(() => tick(true), preview.cpu ? AVR_SLICE_MS : frameMs);
  }
  updateControls();
}

function setStatus(message, error = false) {
  const status = get("firmware-status");
  status.classList.toggle("error", error);
  status.textContent = message;
}

function showProgram() {
  setStatus(preview.cpu ? `${loadedName} · ${flashUsed} / ${preview.model.flash} байт Flash` : "Демо · бегущая строка и 4 эффекта");
  render();
  run();
}

function loadProgram(source, name, modelId) {
  const model = AVR_MODELS[modelId];
  const {program, used} = parseHex(source, model);
  const target = detectAvrGccTarget(program);
  if (target && target !== modelId) {
    throw new Error(`Этот HEX собран для ${AVR_MODELS[target].name}. Выберите этот МК.`);
  }
  preview = new AvrKeyboard(program, model);
  loadedAllEffects = false;
  preview.connectAudio(audioInput);
  selectedMcu = modelId;
  loadedHex = source;
  loadedName = name;
  flashUsed = used;
  playing = true;
  showProgram();
}

get("mcu").addEventListener("change", event => {
  const modelId = event.currentTarget.value;
  try {
    if (loadedAllEffects) loadAllEffects(modelId);
    else if (loadedHex) loadProgram(loadedHex, loadedName, modelId);
    else {
      selectedMcu = modelId;
      updateControls();
    }
  } catch (error) {
    event.currentTarget.value = selectedMcu;
    setStatus(error.message, true);
  }
});

get("load-hex").addEventListener("click", () => get("hex-file").click());
get("hex-file").addEventListener("change", async event => {
  const file = event.currentTarget.files[0];
  event.currentTarget.value = "";
  if (!file) return;
  const request = ++loadRequest;
  try {
    if (file.size > 1024 * 1024) throw new Error("Файл слишком большой для Intel HEX.");
    const source = await file.text();
    if (request !== loadRequest) return;
    const {program} = parseHex(source, AVR_MODELS["328p"]);
    loadProgram(source, file.name, detectAvrGccTarget(program) ?? selectedMcu);
  } catch (error) {
    if (request === loadRequest) setStatus(error.message, true);
  }
});
get("load-test").addEventListener("click", () => {
  loadRequest++;
  loadProgram(testHex, "ZX_LED_Test.hex", selectedMcu);
});
get("load-matrix").addEventListener("click", () => {
  loadRequest++;
  loadProgram(matrixHex, "ZX_LED_Matrix.hex", selectedMcu);
});
function loadAllEffects(modelId) {
  loadProgram(allEffectsHex[modelId], `ZX_LED_All_Effects_atmega${modelId}.hex`, modelId);
  loadedAllEffects = true;
}
get("load-all-effects").hidden = !allEffectsHex;
get("load-all-effects").addEventListener("click", () => {
  loadRequest++;
  loadAllEffects(selectedMcu);
});

const music = get("music-player");
const musicButton = get("audio-play");
let musicUrl = "";
let musicLabel = "";

function stopMusic() {
  if (!musicUrl) return;
  music.pause();
  music.removeAttribute("src");
  music.load();
  URL.revokeObjectURL(musicUrl);
  musicUrl = "";
  musicButton.hidden = true;
}

function selectAudio(sample, label, synchronize = () => {}) {
  audioInput = sample;
  syncAudio = synchronize;
  if (preview.cpu) preview.connectAudio(sample);
  get("audio-status").textContent = label;
}

get("audio-test").addEventListener("click", () => {
  audioRequest++;
  stopMusic();
  selectAudio((channel, time) => {
    const beat = (time * 2 + channel * 0.5) % 1;
    const envelope = Math.exp(-5 * beat);
    return 0.86 * envelope * Math.sin(2 * Math.PI * (channel ? 113 : 79) * time);
  }, "J3 AUDIO · тестовый стереосигнал");
});
get("audio-stop").addEventListener("click", () => {
  audioRequest++;
  stopMusic();
  selectAudio(() => 0, "J3 AUDIO · тишина");
});
get("audio-volume").addEventListener("input", event => {
  const level = Number(event.currentTarget.value);
  music.volume = level / 100;
  get("audio-volume-value").textContent = `${level}%`;
});
music.volume = 0.6;
music.addEventListener("play", () => {
  musicButton.textContent = "Пауза звука";
  if (musicLabel) get("audio-status").textContent = musicLabel;
});
music.addEventListener("pause", () => { musicButton.textContent = "Воспроизвести"; });
musicButton.addEventListener("click", () => {
  if (!music.paused) music.pause();
  else music.play().catch(() => {
    get("audio-status").textContent = `${musicLabel} · браузер не смог воспроизвести файл`;
  });
});
get("audio-load").addEventListener("click", () => get("audio-file").click());
get("audio-file").addEventListener("change", async event => {
  const file = event.currentTarget.files[0];
  event.currentTarget.value = "";
  if (!file) return;
  const request = ++audioRequest;
  let context;
  try {
    const AudioEngine = globalThis.AudioContext ?? globalThis.webkitAudioContext;
    if (!AudioEngine) throw new Error("В этом браузере нет Web Audio.");
    context = new AudioEngine();
    const buffer = await context.decodeAudioData(await file.arrayBuffer());
    const channels = [buffer.getChannelData(0), buffer.getChannelData(Math.min(1, buffer.numberOfChannels - 1))];
    if (request !== audioRequest) return;
    stopMusic();
    musicUrl = URL.createObjectURL(file);
    music.src = musicUrl;
    musicLabel = `J3 AUDIO · ${file.name}`;
    musicButton.hidden = false;
    let audioOffset = 0;
    selectAudio((channel, time) => {
      if (music.paused) return 0;
      const frame = Math.floor(Math.max(0, time + audioOffset) * buffer.sampleRate) % buffer.length;
      return channels[channel][frame];
    }, musicLabel, avr => {
      audioOffset = music.currentTime - (avr.cpu.cycles - avr.audioStartCycle) / AVR_CLOCK_HZ;
    });
    music.play().catch(() => {
      if (request === audioRequest) get("audio-status").textContent = `${musicLabel} · нажмите «Воспроизвести»`;
    });
  } catch (error) {
    if (request === audioRequest) get("audio-status").textContent = `Не удалось открыть звук. ${error.message}`;
  } finally {
    if (context) context.close().catch(() => {});
  }
});
get("use-demo").addEventListener("click", () => {
  loadRequest++;
  loadedHex = "";
  loadedAllEffects = false;
  preview = new FirmwarePreview();
  playing = true;
  showProgram();
});

function bindModeButton(button, id) {
  let heldPreview;
  let handledPointer = false;
  if (id === "mode-screen") {
    button.style.touchAction = "none";
    button.addEventListener("contextmenu", event => {
      if (heldPreview) event.preventDefault();
    });
    button.addEventListener("pointerdown", event => {
      if (event.button !== 0 || !preview.cpu) return;
      heldPreview = preview;
      handledPointer = true;
      button.setPointerCapture(event.pointerId);
      heldPreview.buttonDown(id);
    });
    for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) {
      button.addEventListener(event, () => {
        heldPreview?.buttonUp(id);
        heldPreview = undefined;
      });
    }
  }
  button.addEventListener("click", event => {
    if (handledPointer && event.detail) {
      handledPointer = false;
      return;
    }
    handledPointer = false;
    preview.press(id);
    updateControls();
  });
}
for (const id of ["brightness", "mode-keys", "mode-screen"]) bindModeButton(get(id), id);
get("pause").addEventListener("click", () => {
  playing = !playing;
  run();
});
get("step").addEventListener("click", () => tick());
get("reset").addEventListener("click", () => {
  preview.reset();
  showProgram();
});

const keyRows = [
  ["1","2","3","4","5","6","7","8","9","0"],
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L","ENTER"],
  ["CAPS\nSHIFT","Z","X","C","V","B","N","M","SYMBOL\nSHIFT","SPACE"]
];
const board = get("board");
board.style.aspectRatio = `${layout.width} / ${layout.height}`;
board.style.setProperty("--matrix-height", `${10 / layout.width * 100}cqw`);
board.style.setProperty("--cap-height", `${9 / layout.width * 100}cqw`);
board.dataset.caps = "none";
const stage = get("board-stage");
const viewButton = get("view-3d");
let threeD = false;
let pitch = 25, yaw = -18;
let cameraDrag;
let capEditing = false;
const capButton = get("edit-keycaps");

function updateCamera() {
  board.style.transform = threeD ? `rotateX(${pitch}deg) rotateY(${yaw}deg)` : "";
}

viewButton.addEventListener("click", () => {
  threeD = !threeD;
  viewButton.setAttribute("aria-pressed", String(threeD));
  viewButton.textContent = threeD ? "2D-вид" : "3D-вид";
  get("reset-view").hidden = !threeD;
  stage.classList.toggle("rotatable", threeD);
  updateCamera();
});
get("reset-view").addEventListener("click", () => {
  pitch = 25;
  yaw = -18;
  updateCamera();
});
get("keycaps").addEventListener("change", event => {
  board.dataset.caps = event.currentTarget.value;
  for (const key of get("keyboard").children) key.classList.remove("bare-key");
  capButton.disabled = board.dataset.caps === "none";
  if (capButton.disabled) setCapEditing(false);
});
function setCapEditing(active) {
  capEditing = active;
  capButton.setAttribute("aria-pressed", String(active));
  board.classList.toggle("cap-edit", active);
}
capButton.addEventListener("click", () => setCapEditing(!capEditing));
stage.addEventListener("pointerdown", event => {
  if (!threeD || event.button !== 0 || event.target.closest("button,.key")) return;
  cameraDrag = {x:event.clientX, y:event.clientY, pitch, yaw, pointer:event.pointerId};
  stage.setPointerCapture(event.pointerId);
  stage.classList.add("dragging");
});
stage.addEventListener("pointermove", event => {
  if (!cameraDrag || event.pointerId !== cameraDrag.pointer) return;
  pitch = Math.max(-70, Math.min(70, cameraDrag.pitch - (event.clientY - cameraDrag.y) * 0.37));
  yaw = Math.max(-80, Math.min(80, cameraDrag.yaw + (event.clientX - cameraDrag.x) * 0.42));
  updateCamera();
});
for (const event of ["pointerup", "pointercancel", "lostpointercapture"]) {
  stage.addEventListener(event, pointer => {
    if (pointer.pointerId !== cameraDrag?.pointer) return;
    cameraDrag = undefined;
    stage.classList.remove("dragging");
  });
}

function position(element, x, y) {
  element.style.left = `${x / layout.width * 100}%`;
  element.style.top = `${y / layout.height * 100}%`;
}

const [screenX, screenY, matrixWidth, matrixHeight] = layout.screen;
position(get("screen"), screenX, screenY);
get("screen").style.width = `${matrixWidth / layout.width * 100}%`;
get("screen").style.height = `${matrixHeight / layout.height * 100}%`;

function addWalls(body) {
  for (const side of ["north", "south", "west", "east"]) {
    const wall = document.createElement("span");
    wall.className = `solid-wall ${side}`;
    wall.setAttribute("aria-hidden", "true");
    body.append(wall);
  }
}

for (let i = 0; i < 4; ++i) {
  const body = document.createElement("div");
  body.className = "board-item matrix-body";
  body.setAttribute("aria-hidden", "true");
  position(body, screenX + i * matrixWidth / 4, screenY);
  body.style.width = `${matrixWidth / 4 / layout.width * 100}%`;
  body.style.height = `${matrixHeight / layout.height * 100}%`;
  addWalls(body);
  board.append(body);
}

for (const [x, y] of layout.holes) {
  const hole = document.createElement("div");
  hole.className = "board-item hole";
  position(hole, x, y);
  board.append(hole);
}

const [ispX, ispY] = layout.isp;
const isp = document.createElement("div");
isp.className = "board-item isp";
isp.title = "J6 · ICSP";
position(isp, ispX, ispY);
for (let pin = 0; pin < 6; pin++) isp.append(document.createElement("i"));
board.append(isp);

const controls = [
  ["mode-screen", "MODE SCREEN"],
  ["mode-keys", "MODE KEYS"],
  ["brightness", "BRIGHTNESS"]
];
for (const [index, [id, label]] of controls.entries()) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "board-item board-control";
  button.title = `SW${42 + index} · ${label}`;
  button.setAttribute("aria-label", label);
  position(button, ...layout.controls[index]);
  const caption = document.createElement("span");
  caption.textContent = label;
  button.append(caption);
  bindModeButton(button, id);
  board.append(button);
}

const held = new Set();
function setKey(key, pressed) {
  key.classList.toggle("down", pressed);
  if (pressed) held.add(key);
  else held.delete(key);
  get("key-state").textContent = Array.from(held, item => item.dataset.legend.replace("\n", " ")).join(" + ") || "клавиши отпущены";
}

for (const [index, name] of keyRows.flat().entries()) {
  const key = document.createElement("div");
  key.className = name.length > 1 ? "board-item key special" : "board-item key";
  key.dataset.legend = name;
  const legend = document.createElement("span");
  legend.className = "key-legend";
  legend.textContent = name;
  key.append(legend);
  const cap = document.createElement("span");
  cap.className = "cap-top";
  const capLegend = document.createElement("span");
  capLegend.className = "cap-legend";
  capLegend.textContent = name;
  cap.append(capLegend);
  key.append(cap);
  addWalls(key);
  key.title = `SW${index + 1} · ${name.replace("\n", " ")}`;
  position(key, ...layout.keys[index]);
  key.addEventListener("pointerdown", event => {
    if (capEditing || event.button !== 0) return;
    key.setPointerCapture(event.pointerId);
    setKey(key, true);
  });
  key.addEventListener("click", () => {
    if (capEditing) key.classList.toggle("bare-key");
  });
  key.addEventListener("lostpointercapture", () => setKey(key, false));
  get("keyboard").append(key);
}

function addLed(parent, ref, x, y, color, side) {
  const element = document.createElement("span");
  element.className = side ? "board-item pcb-led side" : "board-item pcb-led";
  element.dataset.ref = ref;
  element.setAttribute("aria-hidden", "true");
  element.style.setProperty("--led", ledColors[color]);
  position(element, x, y);
  parent.append(element);
  return element;
}

const leds = layout.leds.map(([x, y, color, side], index) => {
  const keyIndex = side ? -1 : layout.keys.findIndex(([kx, ky]) => kx === x && y >= ky && y - ky < 8);
  const key = get("keyboard").children[keyIndex];
  key?.style.setProperty("--led", ledColors[color]);
  return {
    element: addLed(get("leds"), `D${index + 1}`, x, y, color, side),
    key, digit: index & 7, mask: 0x80 >> (index >> 3)
  };
});
addLed(board, "D65", ...layout.power, "blue", false).classList.add("on");

render();
run();
</script>
</body>
</html>
